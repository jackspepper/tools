name: Enforce Tool Versioning

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Validate tool versions
        id: validation
        shell: bash
        run: |
          set +e

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          FAILED=0

          {
            echo "# Tool Version Validation"
            echo ""
          } > report.md

          for dir in */ ; do

            TOOL="${dir%/}"

            # Ignore common non-tool directories
            case "$TOOL" in
              .github|docs|renv)
                continue
                ;;
            esac

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$TOOL" || true)

            if [ -z "$CHANGED_FILES" ]; then
              continue
            fi

            echo "Checking: $TOOL"

            #
            # R PACKAGE TOOL
            #
            if [ -f "$TOOL/DESCRIPTION" ]; then

              TYPE="R Package"

              VERSION_RELEVANT=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
                "$TOOL/R" \
                "$TOOL/src" \
                "$TOOL/inst" \
                "$TOOL/data" \
                "$TOOL/NAMESPACE" \
                "$TOOL/DESCRIPTION" || true)

              if [ -z "$VERSION_RELEVANT" ]; then
                continue
              fi

              OLD_VERSION=$(
                git show "$BASE_SHA:$TOOL/DESCRIPTION" 2>/dev/null \
                  | grep '^Version:' \
                  | awk '{print $2}'
              )

              NEW_VERSION=$(
                grep '^Version:' "$TOOL/DESCRIPTION" \
                  | awk '{print $2}'
              )

            #
            # STANDALONE VERSIONED TOOL
            #
            elif [ -f "$TOOL/VERSION" ]; then

              TYPE="Standalone Tool"

              VERSION_RELEVANT=$(echo "$CHANGED_FILES" \
                | grep -v "^${TOOL}/VERSION$" \
                | grep -vi "readme" \
                || true)

              if [ -z "$VERSION_RELEVANT" ]; then
                continue
              fi

              OLD_VERSION=$(git show "$BASE_SHA:$TOOL/VERSION" 2>/dev/null || true)
              NEW_VERSION=$(tr -d '[:space:]' < "$TOOL/VERSION")

            #
            # UNVERSIONED TOOL (WARN ONLY)
            #
            else

              {
                echo "## Warning $TOOL"
                echo ""
                echo "Changes were detected in this directory, but neither a"
                echo "\`DESCRIPTION\` nor a \`VERSION\` file was found."
                echo ""
                echo "This does **not** fail the PR."
                echo ""
                echo "Recommended action:"
                echo ""
                echo "1. Add a \`VERSION\` file"
                echo "2. Start with a version such as:"
                echo "   - \`0.1.0\`"
                echo "   - \`0.1.0.9000\`"
                echo "3. Increment the version when functionality changes"
                echo ""
              } >> report.md

              continue

            fi

            if [ -z "$OLD_VERSION" ] || [ -z "$NEW_VERSION" ]; then

              FAILED=1

              {
                echo "## Failed $TOOL"
                echo ""
                echo "- Type: $TYPE"
                echo "- Could not determine previous/current version."
                echo ""
              } >> report.md

              continue

            fi

            export OLD_VERSION
            export NEW_VERSION

            Rscript -e '
              old <- numeric_version(Sys.getenv("OLD_VERSION"))
              new <- numeric_version(Sys.getenv("NEW_VERSION"))

              if (!(new > old)) {
                quit(status = 1)
              }
            '

            RESULT=$?

            if [ "$RESULT" -ne 0 ]; then

              FAILED=1

              {
                echo "## Failed $TOOL"
                echo ""
                echo "- Type: $TYPE"
                echo "- Version was not incremented."
                echo "- Previous Version: \`$OLD_VERSION\`"
                echo "- Current Version: \`$NEW_VERSION\`"
                echo ""
                echo "Files triggering validation:"
                echo ""
                echo "\`\`\`"
                echo "$VERSION_RELEVANT"
                echo "\`\`\`"
                echo ""
                echo "Required action:"
                echo ""
                if [ "$TYPE" = "R Package" ]; then
                  echo "- Update the \`Version:\` field in \`DESCRIPTION\`"
                else
                  echo "- Update the contents of the \`VERSION\` file"
                fi
                echo ""
              } >> report.md

            else

              {
                echo "## Passed $TOOL"
                echo ""
                echo "- Type: $TYPE"
                echo "- Previous Version: \`$OLD_VERSION\`"
                echo "- Current Version: \`$NEW_VERSION\`"
                echo ""
              } >> report.md

            fi

          done

          REPORT=$(cat report.md)

          {
            echo "failed=$FAILED"
            echo "report<<EOF"
            cat report.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.validation.outputs.report }}`;
            const failed = `${{ steps.validation.outputs.failed }}` === "1";

            const body = failed
              ? `## Tool Version Validation Failed

            One or more versioned tools were modified without a valid version increment.

            ${report}

            ### How to Fix

            **R Packages**
            - Increment the \`Version:\` field in \`DESCRIPTION\`

            **Standalone Tools**
            - Increment the value in the \`VERSION\` file

            Development versions are supported:

            \`\`\`
            1.0.0 -> 1.0.0.9000
            1.0.0.9000 -> 1.0.0.9001
            1.0.0.9001 -> 1.0.1
            \`\`\`
            `
              : `## Tool Version Validation Passed

            ${report}`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });